name: Sprint 2 Ownership Tests

on:
  push:
    branches: ["sprint/02-ownership-authorization"]
  pull_request:
    branches: ["main"]

jobs:
  ownership-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run ownership tests
        run: php artisan test tests/Feature/OwnershipAuthorizationTest.php --testdox
