name: Tests

on:
  push:
    branches: ["main", "sprint/**"]
  pull_request:
    branches: ["main"]

jobs:
  auth-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_user_can_login_and_is_redirected_to_dashboard
          - test_invalid_login_does_not_authenticate_user
          - test_registration_cannot_escalate_role_or_activation_state
          - test_logout_invalidates_authentication
          - test_inactive_user_is_rejected_from_authenticated_application_routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run auth test
        run: php artisan test tests/Feature/AuthenticationSecurityTest.php --filter="${{ matrix.test }}"

  full-tests:
    needs: auth-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run full PHPUnit suite
        run: php artisan test
