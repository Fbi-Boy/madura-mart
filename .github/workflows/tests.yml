name: Tests

on:
  push:
    branches: ["main", "sprint/**"]
  pull_request:
    branches: ["main"]

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Sprint 1 auth tests
        run: php artisan test tests/Feature/AuthenticationSecurityTest.php

      - name: Run full PHPUnit suite
        run: php artisan test
